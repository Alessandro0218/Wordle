<div class="header">
        <button class="login-button" (click)="requestLogin()">Login</button>
</div>
<div class="container">
    <button [ngStyle]="{'background-color': game.GameId ? 'var(--color-correct)' : 'var(--color-danger)'}" class="key" (click)="startGame()">START</button>
    <div class="grid" [ngStyle]="{'grid-template-rows': 'repeat(' + MAX_GUESSES + ', 1fr)'}">
        <div class="row" *ngFor="let guess of guesses; let row = index; trackBy: trackByFn" [ngStyle]="{'grid-template-columns': 'repeat(' + MAX_LENGTH + ', 1fr)'}">
            <div 
                class="cell" 
                *ngFor="let letter of guess.word.split(''); let column = index;" 
                [ngStyle]="{
                    'background-color': getLetterColor(row, column),
                    'animation-delay': (row * 0.1 + column * 0.05) + 's',
                }"
                [ngClass]="getLetterColor(row, column)"
            >
                {{ letter }}
            </div>
        </div>
    </div>
    <div class="keyboard">
        <div class="keyboard-row">
            <button class="key" (click)="emulateKeydown('Q')" [ngClass]="keyboardLettersColor('q')">Q</button>
            <button class="key" (click)="emulateKeydown('W')" [ngClass]="keyboardLettersColor('w')">W</button>
            <button class="key" (click)="emulateKeydown('E')" [ngClass]="keyboardLettersColor('e')">E</button>
            <button class="key" (click)="emulateKeydown('R')" [ngClass]="keyboardLettersColor('r')">R</button>
            <button class="key" (click)="emulateKeydown('T')" [ngClass]="keyboardLettersColor('t')">T</button>
            <button class="key" (click)="emulateKeydown('Y')" [ngClass]="keyboardLettersColor('y')">Y</button>
            <button class="key" (click)="emulateKeydown('U')" [ngClass]="keyboardLettersColor('u')">U</button>
            <button class="key" (click)="emulateKeydown('I')" [ngClass]="keyboardLettersColor('i')">I</button>
            <button class="key" (click)="emulateKeydown('O')" [ngClass]="keyboardLettersColor('o')">O</button>
            <button class="key" (click)="emulateKeydown('P')" [ngClass]="keyboardLettersColor('p')">P</button>
        </div>
        <div class="keyboard-row">
            <button class="key" (click)="emulateKeydown('A')" [ngClass]="keyboardLettersColor('a')">A</button>
            <button class="key" (click)="emulateKeydown('S')" [ngClass]="keyboardLettersColor('s')">S</button>
            <button class="key" (click)="emulateKeydown('D')" [ngClass]="keyboardLettersColor('d')">D</button>
            <button class="key" (click)="emulateKeydown('F')" [ngClass]="keyboardLettersColor('f')">F</button>
            <button class="key" (click)="emulateKeydown('G')" [ngClass]="keyboardLettersColor('g')">G</button>
            <button class="key" (click)="emulateKeydown('H')" [ngClass]="keyboardLettersColor('h')">H</button>
            <button class="key" (click)="emulateKeydown('J')" [ngClass]="keyboardLettersColor('j')">J</button>
            <button class="key" (click)="emulateKeydown('K')" [ngClass]="keyboardLettersColor('k')">K</button>
            <button class="key" (click)="emulateKeydown('L')" [ngClass]="keyboardLettersColor('l')">L</button>
        </div>
        <div class="keyboard-row">
            <button class="key flex-2" (click)="emulateKeydown('Enter')">Enter</button>
            <button class="key" (click)="emulateKeydown('Z')" [ngClass]="keyboardLettersColor('z')">Z</button>
            <button class="key" (click)="emulateKeydown('X')" [ngClass]="keyboardLettersColor('x')">X</button>
            <button class="key" (click)="emulateKeydown('C')" [ngClass]="keyboardLettersColor('c')">C</button>
            <button class="key" (click)="emulateKeydown('V')" [ngClass]="keyboardLettersColor('v')">V</button>
            <button class="key" (click)="emulateKeydown('B')" [ngClass]="keyboardLettersColor('b')">B</button>
            <button class="key" (click)="emulateKeydown('N')" [ngClass]="keyboardLettersColor('n')">N</button>
            <button class="key" (click)="emulateKeydown('M')" [ngClass]="keyboardLettersColor('m')">M</button>
            <button class="key flex-2" (click)="emulateKeydown('Backspace')">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 0 24 24" width="20" class="game-icon" data-testid="icon-backspace"><path fill="var(--color-tone-1)" d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"></path></svg>
            </button>
        </div>
    </div>
</div>
