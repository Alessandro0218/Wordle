<p>Versus game</p>
<p-dialog [modal]="true" [closable]="false" [draggable]="false" [(visible)]="visible" [styleClass]="'my-dialog'" [style]="{ width: '100%', height: '100%', maxHeight: '100%', borderRadius: '0' }">
    <div class="lobby">
        <span class="lobby-title">Lobby</span>
        <div class="lobby-players">
            <div class="row">
                <div class="player" *ngFor="let player of onlinePlayers()">
                    @if (player.Player.discord_id == game.owner?.discord_id || player.Ready) {
                        <div 
                            class="player-state"
                            [ngClass]="{ 
                                'ready': player.Ready,
                                'owner': player.Player.discord_id == game.owner?.discord_id
                            }"
                        >
                            @if (player.Player.discord_id == game.owner?.discord_id) {
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M6.327 19q-.212 0-.356-.144t-.144-.357t.144-.356t.356-.143h11.346q.213 0 .356.144t.144.357t-.144.356t-.356.143zm.777-2.884q-.59 0-1.028-.37t-.562-.94L4.32 8.475q-.05.02-.112.022q-.063.003-.113.003q-.471 0-.783-.32T3 7.404q0-.473.313-.804q.312-.33.784-.33t.803.33q.33.331.33.804q0 .104-.008.193t-.059.176l2.76 1.111q.192.077.385.02q.192-.058.326-.231l2.702-3.66q-.217-.142-.344-.376q-.127-.233-.127-.503q0-.472.331-.803q.33-.331.803-.331q.472 0 .804.33t.332.8q0 .284-.127.512q-.127.23-.344.371l2.702 3.66q.134.173.326.23q.193.059.385-.018l2.76-1.112q-.027-.08-.047-.175q-.02-.096-.02-.194q0-.473.312-.804q.312-.33.784-.33t.803.33q.331.331.331.804q0 .454-.332.775t-.806.321q-.038 0-.086-.012t-.106-.013l-1.184 6.33q-.125.572-.562.941t-1.028.37z"/></svg>
                            } @else if (player.Ready) {
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path fill="currentColor" d="M8.294 16.998c-.435 0-.847-.203-1.111-.553L3.61 11.724a1.39 1.39 0 0 1 .27-1.951a1.39 1.39 0 0 1 1.953.27l2.351 3.104l5.911-9.492a1.396 1.396 0 0 1 1.921-.445c.653.406.854 1.266.446 1.92L9.478 16.34a1.39 1.39 0 0 1-1.12.656z"/></svg>
                            }
                        </div>
                    }
                    <img 
                        class="avatar" 
                        [ngClass]="{
                            'owner': player.Player.discord_id == game.owner?.discord_id,
                            'ready': player.Ready,
                        }" 
                        [src]="'https://cdn.discordapp.com/avatars/'+player.Player.discord_id+'/'+player.Player.discord_avatar+'.webp?size=128'" 
                        alt="avatar"
                    >
                    <span class="username">{{ player.Player.discord_username }}</span>
                </div>
            </div>
            <div class="buttons">
                <!--  [ngClass]="{ 'ready': isReady }" -->
                <button class="btn" pRipple (click)="toggleReady()">{{ 'Ready' }}</button>
                <!-- @if (this.myId !== game.owner?.discord_id) {
                    <button class="btn start-btn" pRipple (click)="startGame()" [disabled]="!canStartGame()">Start game</button>
                } -->
            </div>
        </div>
    </div>
</p-dialog>
